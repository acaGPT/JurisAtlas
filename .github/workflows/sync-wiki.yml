name: 课程 Wiki 同步到 Pages

on:
  schedule:
    # 每日一次，UTC 23:17 对应北京时间次日 07:17；避开整点峰值
    - cron: '17 23 * * *'
  workflow_dispatch:

permissions:
  contents: write

env:
  PUBLISH_DIR: .publish
  SITE_URL: https://acagpt.github.io/JurisAtlas/

jobs:
  sync:
    name: 抽取并发布
    runs-on: ubuntu-latest
    # 复核最长等待 Pages 部署 30 分钟，加上抽取与推送，45 分钟足够
    timeout-minutes: 45

    steps:
      - name: 检出站点仓库
        uses: actions/checkout@v4

      - name: 检出课程 Wiki
        # Wiki 为公开仓库，匿名即可检出，无需额外凭据
        uses: actions/checkout@v4
        with:
          repository: acaGPT/Jurisprudence.wiki
          ref: master
          path: wiki

      - name: 检出 gh-pages 分支产物
        # 发布只替换数据层，站点其余文件沿用分支现有内容，避免整站重建
        run: |
          git fetch origin gh-pages --depth=1
          git worktree add --detach "$PUBLISH_DIR" FETCH_HEAD

      - name: 判定产物是否落后于 Wiki
        id: check
        run: |
          # check-sync.py 以退出码表达判定结果（1 = 落后），而 Actions 的
          # `bash -e` 会把任何非零退出当成步骤失败并立即中断。这里显式吞掉
          # 退出码，判定改由 report.json 驱动后续步骤的条件。
          python3 tools/check-sync.py --offline --wiki-dir wiki \
            --meta "$PUBLISH_DIR/assets/data/meta.json" --json > report.json || true
          cat report.json
          echo "verdict=$(jq -r .verdict report.json)" >> "$GITHUB_OUTPUT"
          echo "wiki=$(jq -r .wiki_source report.json)" >> "$GITHUB_OUTPUT"
          echo "stats=$(jq -r '.local_stats | "单元 \(.units) · 章节 \(.chapters) · 课前概览 \(.preclass)"' report.json)" >> "$GITHUB_OUTPUT"

      - name: 重跑抽取器
        id: extract
        if: steps.check.outputs.verdict == '不同步'
        run: |
          echo "wiki_sha=$(git -C wiki rev-parse --short HEAD)" >> "$GITHUB_ENV"
          python3 tools/extract-syllabus.py --wiki wiki --out /tmp/data --auto
          python3 tools/extract-references.py --wiki wiki --out /tmp/data --auto
          # 周报页可能整页被替换或暂缺；缺了只跳过周报，不拖累地图与文献库的同步
          python3 tools/extract-weekly.py --wiki wiki --out /tmp/data --auto \
            || echo "::warning::周报页缺失或格式异常，本次跳过周报同步"
          # 源 commit 变了不等于内容变了：改动可能落在首页等非数据页面。
          # 按数据文件的字节差异区分「内容更新」与「仅溯源信息更新」（都是纯数据、
          # 不含时间戳，字节比较可靠；时间戳在 meta.json / references-meta.json /
          # weekly-meta.json 里，不参与判定），否则每次同步都会白耗一个版本号。
          changed=false
          for f in syllabus.json references.json weekly.json; do
            if ! diff -q "/tmp/data/$f" "$PUBLISH_DIR/assets/data/$f" >/dev/null 2>&1; then
              changed=true
              echo "内容有变化：$f"
            fi
          done
          echo "content_changed=$changed" >> "$GITHUB_OUTPUT"
          if [ "$changed" = "false" ]; then
            echo "数据层无实质变化，本次仅同步溯源信息"
          fi
          cp /tmp/data/syllabus.json /tmp/data/meta.json \
             /tmp/data/references.json /tmp/data/references-meta.json \
             /tmp/data/weekly.json /tmp/data/weekly-meta.json \
             "$PUBLISH_DIR/assets/data/"

      - name: 推送 gh-pages
        if: steps.check.outputs.verdict == '不同步'
        run: |
          cd "$PUBLISH_DIR"
          if git diff --quiet && git diff --cached --quiet; then
            echo "抽取结果与分支现有内容一致，跳过提交"
            exit 0
          fi
          git add -A
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "同步课程 Wiki 数据层（源 ${wiki_sha}）"
          # 装配用的是 detached worktree，本地并无 gh-pages 分支，
          # 直接 `push origin gh-pages` 会报 src refspec does not match any，
          # 必须把当前 HEAD 显式映射到远端分支。
          git push origin HEAD:refs/heads/gh-pages

      - name: 同步数据层与版本号回 main
        id: bump
        if: steps.check.outputs.verdict == '不同步'
        run: |
          # 数据层必须一并回流 main，否则 main 上的 site/assets/data 永远停在上一轮，
          # 本地 check-sync.py 的「数据层」这一级会恒判落后、失去判定意义。
          cp /tmp/data/syllabus.json /tmp/data/meta.json \
             /tmp/data/references.json /tmp/data/references-meta.json \
             /tmp/data/weekly.json /tmp/data/weekly-meta.json \
             site/assets/data/
          git add site/assets/data
          if [ "${{ steps.extract.outputs.content_changed }}" = "true" ]; then
            version=$(python3 tools/bump-version.py --dry-run)
            echo "version=$version" >> "$GITHUB_OUTPUT"
            python3 tools/bump-version.py --readme README.md
            git add README.md
            msg="同步课程 Wiki 数据层并递增版本至 ${version}（源 ${wiki_sha}）"
          else
            msg="同步课程 Wiki 数据层（源 ${wiki_sha}）"
          fi
          if git diff --cached --quiet; then
            echo "main 侧内容与现有提交一致，跳过提交"
            exit 0
          fi
          # 数据层与版本号合并为一次提交：分两次推的话，第二次会因非快进而失败
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "$msg"
          git push origin HEAD:main

      - name: 创建 Release
        if: steps.check.outputs.verdict == '不同步' && steps.extract.outputs.content_changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.bump.outputs.version }}" \
            --title "${{ steps.bump.outputs.version }} 课程数据同步" \
            --notes "课程 Wiki 更新后站点数据层自动重新抽取并发布。

            源 Wiki：acaGPT/Jurisprudence.wiki（${{ steps.check.outputs.wiki }}）
            本次统计：${{ steps.check.outputs.stats }}

            站点：<${SITE_URL}>"

      - name: 复核线上同步
        if: steps.check.outputs.verdict == '不同步'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 复核只比「本轮刚推送的产物」与「线上 Pages」，不比 main 上的数据层快照：
          # main 的 site/assets/data 在同步发生前仍是上一轮内容，拿它当基准会恒判
          # 「不同步」——10 月中旬连续四次运行因此误报失败，而线上其实早已对齐。
          # Pages 从推送到可访问通常要十几分钟，窗口取 30 分钟；等待期间若查到
          # Pages 最近一次构建为 errored，则立即失败——构建失败不会随时间好转。
          start=$(date +%s)
          limit=1800
          attempt=1
          while :; do
            if python3 tools/check-sync.py --wiki-dir wiki --site-url "$SITE_URL" \
                 --meta "$PUBLISH_DIR/assets/data/meta.json"; then
              echo "线上已与 Wiki 对齐（第 ${attempt} 次复核，耗时 $(( $(date +%s) - start )) 秒）"
              exit 0
            fi
            build=$(gh api "repos/${GITHUB_REPOSITORY}/pages/builds/latest" \
                      --jq '.status + " " + (.error.message // "无错误信息")' 2>/dev/null || echo "未知")
            echo "第 ${attempt} 次复核：线上尚未更新；Pages 最近构建：${build}"
            case "$build" in
              errored*)
                echo "Pages 构建已失败，继续等待无意义，请检查 Pages 部署日志"
                exit 1
                ;;
            esac
            elapsed=$(( $(date +%s) - start ))
            if [ "$elapsed" -ge "$limit" ]; then
              echo "线上在 30 分钟内仍未更新，请手动核查 Pages 部署状态"
              exit 1
            fi
            echo "60 秒后重试（已等待 ${elapsed} 秒）"
            sleep 60
            attempt=$((attempt + 1))
          done

      - name: 无需同步时说明
        if: steps.check.outputs.verdict != '不同步'
        run: |
          echo "本次无需同步（${{ steps.check.outputs.verdict }}），站点内容已是 Wiki 最新。"
